[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgprr-factcheck"
version = "0.2.0"
description = "Private local RAG + fact-check over switchable document collections (CGPRR, Track C)"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.12,<3",
  "httpx>=0.27,<1",
  "rank-bm25>=0.2.2",
  "numpy>=1.26",
  "snowballstemmer>=2.2",
  # document loaders (PDF, Word, HTML); pure-Python, no native dependencies
  "pypdf>=4.0",
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "mypy>=1.10", "ruff>=0.5"]
otel = ["opentelemetry-api>=1.25", "opentelemetry-sdk>=1.25"]

[project.scripts]
cgprr = "cgprr.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py311"

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
